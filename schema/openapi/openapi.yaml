          content:
            application/json:
              schema:
                type: object
                properties:
                  soft_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/opportunity_items/restore/bulk:
    post:
      tags:
        - OpportunityItems
      summary: Bulk restore OpportunityItems by ids (atomic)
      operationId: bulkRestoreOpportunityItems
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityItemBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/opportunity_items/restore/all:
    post:
      tags:
        - OpportunityItems
      summary: Restore all soft-deleted OpportunityItems
      operationId: restoreAllOpportunityItems
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: integer }

  /api/v1/opportunity_items/trash/bulk:
    delete:
      tags:
        - OpportunityItems
      summary: Bulk permanently-delete OpportunityItems from trash by ids (atomic)
      operationId: bulkPermanentDeleteOpportunityItems
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  permanently_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

